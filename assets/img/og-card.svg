<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f2ec"/>
      <stop offset="1" stop-color="#ece7de"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5f63"/>
      <stop offset="1" stop-color="#0a474b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e5f63" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0e5f63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="320" fill="url(#glow)"/>
  <circle cx="110" cy="580" r="260" fill="url(#glow)"/>

  <!-- accent rule -->
  <rect x="96" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- name -->
  <text x="96" y="252"
